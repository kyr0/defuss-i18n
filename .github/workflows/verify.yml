name: Verify defuss-i18n
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # Tests run on Node (node --test); consumers do too.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup
      - run: make verify
